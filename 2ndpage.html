<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="2ndstyle.css">

</head>
<body>
    <h1>Contact me</h1>
    <form>
        <div class="container">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your Name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="your.email@example.com">

            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Your message here..."></textarea>

            <button type="submit">Send</button>
        </div>
    </form>
    
</body>
</html>
<h1>Create Account</h1>
<form>
    <div class="container">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Choose a username">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password">

        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password">

        <label for="email-signup">Email:</label>
        <input type="email" id="email-signup" name="email-signup" placeholder="your.email@example.com">

        <button type="submit">Create Account</button>
    </div>
</form>

<h1>Preferences</h1>
<form>
    <div class="container">
        <label for="preferences">Select your preferences:</label>
        <input type="checkbox" id="preference1" name="preference1" value="Option1">
        <label for="preference1">Option 1</label><br>
        
        <input type="checkbox" id="preference2" name="preference2" value="Option2">
        <label for="preference2">Option 2</label><br>
        
        <input type="radio" id="radio1" name="radioGroup" value="Choice1">
        <label for="radio1">Choice 1</label><br>
        
        <input type="radio" id="radio2" name="radioGroup" value="Choice2">
        <label for="radio2">Choice 2</label><br>
        
        <input type="radio" id="radio3" name="radioGroup" value="Choice3">
        <label for="radio3">Choice 3</label><br>
        
        <button type="submit">Submit Preferences</button>
    </div>
</form>
